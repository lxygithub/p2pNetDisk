org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- 本机开发网络配置 ---
# Java/Gradle 不读 shell 的 HTTP_PROXY 环境变量，必须在这里设 JVM 系统属性，
# 否则 google() / mavenCentral() / gradlePluginPortal() 会直接连并超时。
# 端口对应 Clash 混合端口；如果换了端口，改下面四个值即可。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
# 阿里云镜像走直连（比绕代理快且稳定），官方源仍走代理。
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com

# --- 关闭 Kotlin 增量编译（跨盘路径问题）---
# pub 缓存在 C:\Users\...\AppData\Local\Pub\Cache，项目在 D:\。
# Kotlin 增量编译器用 relativeTo() 存源文件路径，跨盘会抛
#   IllegalArgumentException: this and base files have different roots
# 导致 "Could not close incremental caches" 整个 build 失败。
# Flutter 侧 Kotlin 代码量很小，全量编译的代价可以忽略。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
